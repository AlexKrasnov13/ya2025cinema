name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker compose --version
      
      - name: Start services with Docker Compose
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          # Wait for all services to be healthy
          timeout 300 sh -c 'until docker compose ps | grep -q "(healthy)"; do echo "Waiting for services..."; sleep 5; done' || echo "Timeout waiting for services"
          docker compose ps
          # Additional wait to ensure all services are fully ready
          sleep 30

      - name: Verify network exists
        run: |
          docker network ls
          docker network inspect cinemaabyss-network || echo "Network not found"

      - name: Build test container
        working-directory: tests/postman
        run: |
          docker build -t cinemaabyss-api-tests .

      - name: Test network connectivity
        run: |
          echo "Testing connectivity from test container to services..."
          docker run --rm --network cinemaabyss-network alpine:latest sh -c "
            apk add --no-cache curl &&
            echo 'Testing monolith...' &&
            curl -f http://monolith:8080/health || echo 'Monolith not reachable' &&
            echo 'Testing movies-service...' &&
            curl -f http://movies-service:8081/api/movies/health || echo 'Movies service not reachable' &&
            echo 'Testing events-service...' &&
            curl -f http://events-service:8082/api/events/health || echo 'Events service not reachable' &&
            echo 'Testing proxy-service...' &&
            curl -f http://proxy-service:8000/health || echo 'Proxy service not reachable'
          "

      - name: Run API tests
        run: |
          # Run the tests in Docker with the same network as services
          docker run --rm \
            --network cinemaabyss-network \
            -v "$(pwd)/tests/postman/reports:/app/reports" \
            cinemaabyss-api-tests --environment docker

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: tests/postman/reports/
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker compose down